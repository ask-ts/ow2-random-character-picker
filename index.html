<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
        <title>OW2ランダムキャラピッカー</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="text-center header-color"><h1>OW2ランダムキャラピッカー</h1></div>
        <div class="d-flex justify-content-center">
            <div class="d-flex result-area role justify-content-center align-items-center border border-4">
                <span id="charRoleResult" class="fs-3 fw-bold">ロール</span>
            </div>
            <div class="d-flex result-area character justify-content-center align-items-center border border-4">
                <span id="charNameResult" class="fs-3 fw-bold">キャラクター</span>
            </div>
        </div>
        <div class="d-flex justify-content-center m-3">
            <select id="roleSelect">
                <option value="">フレックス</option>
                <option value="tank">タンク</option>
                <option value="dmg">ダメージ</option>
                <option value="sup">サポート</option>
            </select>
        </div>
        <div class="d-flex justify-content-center">
            <button id="pickButton" class="btn btn-primary fs-3" type="button" onclick="charPick()">ピック！</button>
        </div>
        <div class="d-flex justify-content-center m-3">
            <div class="border border-3 p-2">
                <h5 class="text-center mb-0">ピック履歴</h5>
                <p class="fs-6 fw-normal text-black-50 mb-0">※履歴は10回まで表示されます。</p>
            </div>
        </div>
        <div class="d-flex justify-content-center">
            <table class="table table-bordered history-table">
                <thead>
                    <tr>
                        <th class="text-center history-times">回数</th>
                        <th class="text-center history-role">ロール</th>
                        <th class="text-center history-chars">キャラ</th>
                    </tr>
                </thead>
                <tbody id="pickHistory">
                </tbody>
            </table>
        </div>
        <script src="pickHistoryDisplay.js"></script>
        <script src="charPick.js"></script>
    </body>
</html>
